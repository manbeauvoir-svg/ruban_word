<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Ruban de Word - Interactif</title>
<style>
  :root{
    --blue:#2e7dd6; --blue-dark:#1c5aa8;
    --card:#ffffff; --text:#22314a; --muted:#5c6b82; --border:#dbe4f0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,#eef3fb,#e3edf9);color:var(--text);padding:30px 16px 60px;}
  .wrap{max-width:1000px;margin:0 auto;}
  h1{text-align:center;font-size:26px;color:var(--blue-dark);margin-bottom:4px;}
  .subtitle{text-align:center;color:var(--muted);margin-bottom:26px;font-size:15px;}

  .word-window{background:var(--card);border-radius:10px;box-shadow:0 12px 30px rgba(30,60,110,0.15);overflow:hidden;border:1px solid var(--border);}
  .titlebar{background:var(--blue-dark);color:#fff;font-size:13px;padding:8px 14px;display:flex;align-items:center;gap:8px;}
  .titlebar .dot{width:10px;height:10px;border-radius:50%;}
  .titlebar .dot.r{background:#ff5f57;} .titlebar .dot.y{background:#febc2e;} .titlebar .dot.g{background:#28c840;}
  .titlebar span.name{margin-left:8px;opacity:0.9;}

  .tabs{display:flex;flex-wrap:wrap;background:#fbfcfe;border-bottom:1px solid var(--border);padding:0 8px;}
  .tab{padding:11px 16px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;transition:.15s;user-select:none;white-space:nowrap;}
  .tab:hover{color:var(--blue-dark);background:#eef4fc;}
  .tab.active{color:var(--blue-dark);font-weight:600;border-bottom:3px solid var(--blue);background:#eef4fc;}

  .ribbon{background:#f7f9fc;padding:14px 18px;display:flex;gap:0;flex-wrap:wrap;min-height:120px;}
  .group{display:flex;flex-direction:column;align-items:center;padding:6px 16px;border-right:1px solid var(--border);min-width:120px;}
  .group:last-child{border-right:none;}
  .group-tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;flex:1;}
  .tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:.15s;width:70px;}
  .tool:hover{background:#dceafd;}
  .tool.selected{background:#c9e2ff;box-shadow:inset 0 0 0 1px var(--blue);}
  .tool-icon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .tool-label{font-size:10.5px;text-align:center;color:var(--text);line-height:1.15;}
  .group-name{font-size:11px;color:var(--muted);margin-top:6px;text-align:center;}

  .explain{margin-top:22px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;min-height:110px;box-shadow:0 6px 18px rgba(30,60,110,0.08);}
  .explain-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .explain-icon{width:40px;height:40px;border-radius:10px;background:#eef4fc;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .explain h3{margin:0;color:var(--blue-dark);font-size:17px;}
  .explain .group-sub{margin:2px 0 0;color:var(--muted);font-size:12.5px;}
  .explain .role{margin:0 0 10px;color:var(--text);font-size:14.5px;line-height:1.5;}
  .explain .howto{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;background:#eef4fc;border-left:3px solid var(--blue);padding:8px 12px;border-radius:4px;}
  .explain .howto b{color:var(--blue-dark);}
  .explain .placeholder{color:#9aa8bd;font-style:italic;}
  .tab-tip{margin-top:14px;background:#fff8e1;border-left:4px solid #ffc107;border-radius:8px;padding:10px 14px;font-size:13.5px;color:#5c5240;line-height:1.5;}
  .tab-tip b{color:#a8781a;}
  .tab-tip.hidden{display:none;}
  .hint{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Le Ruban de Word</h1>
  <p class="subtitle">Cliquez sur un onglet, puis sur un outil, pour voir son rôle et comment l'utiliser.</p>

  <div class="word-window">
    <div class="titlebar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="name">Document1 - Word</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="ribbon" id="ribbon"></div>
  </div>

  <div class="explain" id="explain"><p class="placeholder">Sélectionnez un outil dans le ruban ci-dessus pour afficher son explication ici.</p></div>
  <div class="tab-tip hidden" id="tabTip"></div>
  <p class="hint">Astuce : chaque onglet regroupe les outils liés à une même tâche.</p>
</div>

const tabsEl = document.getElementById('tabs');
const ribbonEl = document.getElementById('ribbon');
const explainEl = document.getElementById('explain');
let activeTab = "Fichier";

function renderTabs(){
  tabsEl.innerHTML = '';
  Object.keys(DATA).forEach(name=>{
    const t = document.createElement('div');
    t.className = 'tab' + (name===activeTab ? ' active' : '');
    t.textContent = DATA[name].icon + '  ' + name;
    t.onclick = ()=>{ activeTab = name; renderTabs(); renderRibbon(); resetExplain(); showTabTip(); };
    tabsEl.appendChild(t);
  });
}
function showTabTip(){
  const tipEl = document.getElementById('tabTip');
  const tip = DATA[activeTab].tip;
  if(tip){
    tipEl.innerHTML = `💡 <b>Astuce :</b> ${tip}`;
    tipEl.classList.remove('hidden');
  } else {
    tipEl.classList.add('hidden');
  }
}
function renderRibbon(){
  ribbonEl.innerHTML = '';
  DATA[activeTab].groups.forEach(group=>{
    const g = document.createElement('div');
    g.className = 'group';
    const toolsWrap = document.createElement('div');
    toolsWrap.className = 'group-tools';
    group.tools.forEach(tool=>{
      const tEl = document.createElement('div');
      tEl.className = 'tool';
      tEl.innerHTML = `<div class="tool-icon">${tool.icon}</div><div class="tool-label">${tool.label}</div>`;
      tEl.onclick = ()=>{
        document.querySelectorAll('.tool').forEach(x=>x.classList.remove('selected'));
        tEl.classList.add('selected');
        showExplain(tool.icon, tool.label, tool.role, tool.howto);
      };
      toolsWrap.appendChild(tEl);
    });
    g.appendChild(toolsWrap);
    const nameEl = document.createElement('div');
    nameEl.className = 'group-name';
    nameEl.textContent = group.name;
    g.appendChild(nameEl);
    ribbonEl.appendChild(g);
  });
}
function showExplain(icon, label, role, howto){
  explainEl.innerHTML = `<div class="explain-head"><div class="explain-icon">${icon}</div><h3>${label}</h3></div><p class="role">${role}</p><p class="howto"><b>Comment l'utiliser :</b> ${howto}</p>`;
}
function resetExplain(){
